<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TMFD - 학습자료실</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/study.css" />
  </head>
  <body>
    <!-- 상단바 -->
    <header class="site-shell">
      <div class="site-bar">
        <button class="icon-btn" aria-label="메뉴">
          <span class="threeline">☰</span>
        </button>

        <a href="/index" class="logo" aria-label="홈">
          <img src="/static/assets/image.png" alt="TMFD Logo" />
        </a>

        <nav class="main-nav" aria-label="주 메뉴">
          <a href="/index" class="sub-nav">공유 일정</a>
          <a href="/personal" class="sub-nav">개인 일정</a>
          <a href="/assessment" class="sub-nav">수행평가</a>
          <a href="/TimeAndFood" class="sub-nav">급식표 및 시간표</a>
          <a href="/study" class="sub-nav active">학습자료실</a>
          <a href="/about" class="sub-nav">도움말</a>
        </nav>

        <div class="user-actions">
          <!-- username 우선, 없으면 current_user 사용 -->
          <div class="small-link">
            {{ username or current_user }} 님, 환영합니다!
          </div>
          <form action="/logout" method="post" style="display: inline">
            <button type="submit" class="logout-btn">로그아웃</button>
          </form>
        </div>
      </div>
    </header>

    <!-- 본문 -->
    <main>
      <div class="container">
        <div class="topline">
          <h1>학습자료실</h1>
          <button class="home-btn" onclick="location.href='/index'">
            홈으로 가기
          </button>
        </div>

        <div class="subject-list">
          <div class="subject kor">
            <span class="emoji">📖</span>
            <div>
              <h2>국어</h2>
              <button
                onclick="window.open('https://drive.google.com/drive/folders/1-ff6qkpYigtwhuaUJqpBq13AY-21ExvJ?usp=sharing','_blank')"
                class="btn1"
              >
                바로가기
              </button>
            </div>
          </div>

          <div class="subject math">
            <span class="emoji">🧮</span>
            <div>
              <h2>수학</h2>
              <button
                onclick="window.open('https://drive.google.com/drive/folders/185CVzX_neXVfpc2Ocpt1e2TtztCqaWXc?usp=sharing','_blank')"
                class="btn1"
              >
                바로가기
              </button>
            </div>
          </div>

          <div class="subject soc">
            <span class="emoji">🌏</span>
            <div>
              <h2>사회</h2>
              <button
                onclick="window.open('https://drive.google.com/drive/folders/1vlTz2PaFm8V5xvnvEywHED6izm7HeZUW?usp=sharing','_blank')"
                class="btn1"
              >
                바로가기
              </button>
            </div>
          </div>

          <div class="subject sci">
            <span class="emoji">🔬</span>
            <div>
              <h2>과학</h2>
              <button
                onclick="window.open('https://drive.google.com/drive/folders/1SFE8UhNvzEhp1Ce_cwlCbZwuy8b9-z19?usp=sharing','_blank')"
                class="btn1"
              >
                바로가기
              </button>
            </div>
          </div>

          <div class="subject eng">
            <span class="emoji">📝</span>
            <div>
              <h2>영어</h2>
              <button
                onclick="window.open('https://drive.google.com/drive/folders/147KGQWS7pbG0S6oFNd9JfIPQK3JBNN4M?usp=sharing','_blank')"
                class="btn1"
              >
                바로가기
              </button>
            </div>
          </div>

          <div class="subject hist">
            <span class="emoji">🏛️</span>
            <div>
              <h2>한국사</h2>
              <button
                onclick="window.open('https://drive.google.com/drive/folders/1rpYyQYT682nhiY3J6fBiChkj_j3oERnX?usp=sharing','_blank')"
                class="btn1"
              >
                바로가기
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
