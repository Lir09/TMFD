<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>TMFD - 시간표</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/static/css/TimeAndFood.css">
</head>
<body>
  <div class="wrap">
    <div class="header">
      <a class="title" href="./index.html">TMFD 시간표</a>
      <div class="today-info" id="todayInfo">-</div>
    </div>

    <div class="statusbar">
      <span class="badge" id="stateBadge">상태 계산 중…</span>
      <span class="badge dim" id="nextBadge"></span>
    </div>

    <div class="grid">
      <div class="card table-card">
        <div class="table-head">
          <div class="hint">오늘 요일 열(초록) + 현재 교시 행(연한 주황) 하이라이트.</div>
        </div>
        <div class="table-wrap">
          <table id="timetable"></table>
        </div>
        <div class="footer-note">* 교사명은 다수일 경우 · 로 구분됩니다. 요일별 다른 담당은 자동 반영.</div>
      </div>

      <aside class="card side">
        <div>
          <span class="day-badge" id="dayBadge">오늘</span>
          <h3>오늘 시간표</h3>
        </div>
        <div class="list" id="todayList"></div>
        <div class="legend">공강/비어있음은 회색 · 현재 교시는 주황 테두리.</div>
      </aside>
    </div>
  </div>

<script src="/static/js/TimeAndFood.js"></script>
</body>
</html>
