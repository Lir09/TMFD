<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>수행평가 관리 · TMFD</title>
<style>
  :root{
    --bg:#fff;
    --panel:#fff;
    --card:#fafbfc;
    --muted:#888;
    --text:#151515;
    --brand:#5b82d8;
    --ok:#3bd671;
    --warn:#ffe066;
    --danger:#ff5252;
    --line:#e5e7eb;
    --chip:#f4f6fa;
    --shadow: 0 4px 16px rgba(0,0,0,.08);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg);
    color:var(--text); font:14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif;
  }
  .wrap{max-width:1200px;margin:32px auto;padding:0 16px}
  header{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:16px}
  .title{font-size:24px;font-weight:800;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:12px}
  .layout{display:grid;grid-template-columns:1fr 320px;gap:16px}
  @media (max-width: 1024px){ .layout{grid-template-columns:1fr} }

  /* Subject tabs */
  .tabs{
    display:flex;gap:10px;flex-wrap:wrap;padding:12px;background:var(--panel);
    border:1px solid var(--line); border-radius:var(--radius); position:sticky; top:0; z-index:3
  }
  .tab{
    display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;
    background:var(--chip); color:#333; border:1px solid transparent; cursor:pointer; transition:.15s;
    user-select:none
  }
  .tab:hover{transform:translateY(-1px)}
  .tab.active{background:#e9f0ff;border-color:#5b82d8;color:#222;box-shadow:0 6px 18px rgba(91,130,216,.10)}
  .tab .dot{width:8px;height:8px;border-radius:50%}
  .dot.kor{background:#8bd3ff}.dot.math{background:#ff9f7c}.dot.eng{background:#ffd166}
  .dot.soc{background:#7ee787}.dot.sci{background:#ff6b6b}.dot.his{background:#c792ea}
  .dot.inf{background:#7c9cff}.dot.lab{background:#61dafb}

  /* Main card */
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)
  }
  .card h3{margin:0;padding:16px 16px 0 16px}
  .toolbar{display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
  .toolbar input,.toolbar select{
    background:#f4f6fa; color:#222; border:1px solid #d1d5db; border-radius:10px; padding:10px 12px; outline:none
  }
  .toolbar .spacer{flex:1}

  /* Table */
  .table{width:100%;border-collapse:separate;border-spacing:0 10px;padding:12px}
  .table thead th{font-size:12px;color:var(--muted);text-align:left;padding:0 10px}
  .row{
    display:grid; grid-template-columns:28px 110px 1fr 88px 112px 96px 104px 80px 76px;
    gap:10px; align-items:center; background:var(--card); border:1px solid #e5e7eb;
    border-radius:12px; padding:12px; margin-top:10px
  }
  .cell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{
    display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#f4f6fa;border:1px solid #e5e7eb;font-size:12px
  }
  .status{font-weight:700}
  .status.p0{color:#aab4c4}
  .status.p1{color:#5b82d8}
  .status.p2{color:#3bd671}
  .status.p3{color:#c792ea}
  .status.p4{color:#151515}
  .due{font-weight:700}
  .due.red{color:var(--danger)} .due.orange{color:var(--warn)} .due.gray{color:var(--muted)}
  .progress{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden}
  .progress>i{display:block;height:100%;background:linear-gradient(90deg,#5b82d8,#61dafb)}
  .btn{
    background:#f4f6fa;border:1px solid #d1d5db;color:#222;padding:8px 12px;border-radius:10px;cursor:pointer
  }
  .btn.primary{background:#5b82d8;border-color:#5b82d8;color:#fff;}
  .btn.ghost{background:#fff;border-color:#e5e7eb}
  .badge{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid #e5e7eb;background:#f4f6fa;color:#333}

  /* Right panel */
  .side{display:flex;flex-direction:column;gap:12px}
  .side .section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px}
  .side h4{margin:0 0 8px 0}
  .task{display:flex;align-items:center;justify-content:space-between;padding:12px;border-radius:12px;background:var(--card);border:1px solid #e5e7eb;margin-top:8px}
  .task .left{display:flex;align-items:center;gap:10px}
  .task .when{font-size:12px;color:var(--muted)}
  .chip{font-size:12px;background:#f4f6fa;border:1px solid #e5e7eb;border-radius:8px;padding:6px 8px}
  .task.warn{outline:1px solid var(--warn)} .task.late{outline:1px solid var(--danger)}

  /* Drawer */
  .drawer{position:fixed;inset:0;background:rgba(0,0,0,.18);display:none;place-items:center;padding:20px}
  .drawer.open{display:grid}
  .drawer .pane{width:min(720px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  .pane header{padding:14px 16px;border-bottom:1px solid var(--line)}
  .pane .body{padding:16px;display:grid;gap:14px}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:10px}
  .checklist li{display:flex;gap:10px;align-items:center;margin:8px 0}
  .muted{color:var(--muted)}
  a{color:#5b82d8;text-decoration:none}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="title" style="cursor:pointer;" onclick="window.location.href='index.html'">수행평가 관리</div>
        <div class="sub">상단 과목 탭 선택 → 아래에서 과제 현황 관리</div>
      </div>
      <div class="sub" id="today"></div>
    </header>

    <!-- Subject Tabs -->
    <div class="tabs" id="tabs">
      <button class="tab active" data-subj="국어"><span class="dot kor"></span>국어</button>
      <button class="tab" data-subj="수학"><span class="dot math"></span>수학</button>
      <button class="tab" data-subj="영어"><span class="dot eng"></span>영어</button>
      <button class="tab" data-subj="사회"><span class="dot soc"></span>사회</button>
      <button class="tab" data-subj="과학"><span class="dot sci"></span>과학</button>
      <button class="tab" data-subj="한국사"><span class="dot his"></span>한국사</button>
      <button class="tab" data-subj="정보"><span class="dot inf"></span>정보</button>
      <button class="tab" data-subj="과탐실"><span class="dot lab"></span>과탐실</button>
      <span class="spacer"></span>
    </div>

    <div class="layout">
      <!-- Main board -->
      <div class="card">
        <div class="toolbar">
          <input id="q" placeholder="과제명/키워드 검색" />
          <select id="status">
            <option value="">상태 전체</option>
            <option>미제출</option><option>진행중</option><option>제출</option><option>채점중</option><option>완료</option>
          </select>
          <select id="sort">
            <option value="due">마감일 오름차순</option>
            <option value="remaining">남은시간 오름차순</option>
            <option value="progress">진행률 내림차순</option>
          </select>
          <button class="btn ghost" id="clear">필터 초기화</button>
        </div>

        <div id="table" style="padding-bottom:10px">
          <div style="padding:8px 12px;color:var(--muted);font-size:12px">체크 → 일괄 작업(곧 추가). 행 클릭 → 상세 드로어.</div>
          <div class="row muted" aria-hidden="true" style="pointer-events:none;">
            <div class="cell">선택</div><div class="cell">과목</div><div class="cell">과제명</div>
            <div class="cell">유형</div><div class="cell">마감</div><div class="cell">남은시간</div>
            <div class="cell">상태</div><div class="cell">진행률</div><div class="cell">점수</div>
          </div>
          <!-- rows injected here -->
          <div id="rows"></div>
        </div>
      </div>

      <!-- Right panel -->
      <aside class="side">
        <div class="section">
          <h4>오늘 할 일</h4>
          <div id="todayList"></div>
        </div>
        <div class="section">
          <h4>임박(48h)</h4>
          <div id="soonList"></div>
        </div>
        <div class="section">
          <h4>지각</h4>
          <div id="lateList"></div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Drawer -->
  <div class="drawer" id="drawer" role="dialog" aria-modal="true">
    <div class="pane">
      <header>
        <div class="title" id="dwTitle" style="font-size:18px"></div>
      </header>
      <div class="body">
        <div class="kv"><div class="muted">과목</div><div id="dwSubj"></div></div>
        <div class="kv"><div class="muted">유형</div><div id="dwType"></div></div>
        <div class="kv"><div class="muted">마감일</div><div id="dwDue"></div></div>
        <div class="kv"><div class="muted">상태</div><div id="dwStatus"></div></div>
        <div class="kv"><div class="muted">진행률</div>
          <div><div class="progress"><i id="dwProg" style="width:0%"></i></div></div>
        </div>
        <div>
          <div class="muted" style="margin-bottom:6px">체크리스트</div>
          <ul class="checklist" id="dwList"></ul>
        </div>
        <div class="muted">제출/재제출, 루브릭, 코멘트 기능은 백엔드 연동 시 활성화.</div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button class="btn" onclick="closeDrawer()">닫기</button>
          <button class="btn primary">제출하기</button>
        </div>
      </div>
    </div>
  </div>

<script>
/* ---------- demo data ---------- */
const data = [
 {id:'a1',subject:'국어', title:'현대시 이미지 분석 발표', type:'발표', dueAt:addDays(0,18), status:'진행중', progress:60, checklist:['작품선정','구조분석','발표자료 작성','리허설'], done:[1,1,1,0], score:null},
 {id:'a2',subject:'수학', title:'함수 모델링 프로젝트', type:'보고서', dueAt:addDays(1,23), status:'미제출', progress:20, checklist:['데이터 수집','모델 적합','오차분석','보고서'], done:[1,0,0,0]},
 {id:'a3',subject:'영어', title:'뉴스 스크립트 요약', type:'보고서', dueAt:addDays(3,17), status:'제출', progress:100, checklist:['요약','교정','제출'], done:[1,1,1], score:92},
 {id:'a4',subject:'사회', title:'지방소멸 리서치 인포그래픽', type:'발표', dueAt:addDays(2,12), status:'진행중', progress:40, checklist:['자료조사','시각화','발표문'], done:[1,0,0]},
 {id:'a5',subject:'과학', title:'엔자임 반응속도 실험 보고', type:'실험', dueAt:addDays(-1,16), status:'미제출', progress:0, checklist:['실험','그래프','논의','제출'], done:[1,0,0,0]},
 {id:'a6',subject:'한국사', title:'근현대사 사건 비교 에세이', type:'보고서', dueAt:addDays(5,18), status:'채점중', progress:100, checklist:['초안','피드백','최종'], done:[1,1,1]},
 {id:'a7',subject:'정보', title:'파이썬 자료구조 실습 과제', type:'코딩', dueAt:addDays(0,23), status:'진행중', progress:50, checklist:['문제풀이','테스트','리포트'], done:[1,0,0]},
 {id:'a8',subject:'과탐실', title:'pH 측정 및 오차 분석', type:'실험', dueAt:addDays(0,20), status:'진행중', progress:30, checklist:['실험','정리','보고'], done:[1,0,0]},
];
/* ---------- utils ---------- */
function addDays(d,h=9){const x=new Date();x.setHours(9,0,0,0);x.setDate(x.getDate()+d);x.setHours(h);return x}
function fmtDate(dt){return dt.toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function hoursLeft(dt){return (dt - new Date())/36e5}
function dueClass(dt){
  const h=hoursLeft(dt);
  if(h<0) return 'red';
  if(h<=48) return 'orange';
  return 'gray';
}
/* ---------- state ---------- */
let current='국어';
let q=''; let st=''; let sort='due';
/* ---------- DOM refs ---------- */
const rowsEl = document.getElementById('rows');
const tabsEl = document.getElementById('tabs');
const todayEl = document.getElementById('today');
const qEl = document.getElementById('q');
const stEl = document.getElementById('status');
const sortEl = document.getElementById('sort');
document.getElementById('clear').onclick=()=>{qEl.value='';stEl.value='';sortEl.value='due';q='';st='';sort='due';render()}
/* ---------- header today ---------- */
todayEl.textContent = new Date().toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit'});
/* ---------- tabs ---------- */
tabsEl.addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  b.classList.add('active'); current=b.dataset.subj; render();
});
/* ---------- filters ---------- */
qEl.oninput = e=>{q=e.target.value.trim(); render();}
stEl.onchange = e=>{st=e.target.value; render();}
sortEl.onchange = e=>{sort=e.target.value; render();}
/* ---------- right lists ---------- */
const fillSide = ()=>{
  const tList=document.getElementById('todayList');
  const sList=document.getElementById('soonList');
  const lList=document.getElementById('lateList');
  [tList,sList,lList].forEach(n=>n.innerHTML='');

  data.forEach(x=>{
    const h=hoursLeft(x.dueAt);
    const item = (cls)=>`
      <div class="task ${cls}">
        <div class="left">
          <span class="badge">${x.subject}</span>
          <div>
            <div>${x.title}</div>
            <div class="when">${fmtDate(x.dueAt)} · ${x.type}</div>
          </div>
        </div>
        <button class="btn" onclick="openDrawer('${x.id}')">상세</button>
      </div>`;
    if(h<0) lList.insertAdjacentHTML('beforeend',item('late'));
    else if(h<=48 && x.dueAt.toDateString()!==new Date().toDateString()) sList.insertAdjacentHTML('beforeend',item('warn'));
    else if(x.dueAt.toDateString()===new Date().toDateString()) tList.insertAdjacentHTML('beforeend',item(''));
  });
};
/* ---------- main table render ---------- */
function render(){
  const list = data
    .filter(x=>x.subject===current)
    .filter(x=>!q || (x.title+x.type).includes(q))
    .filter(x=>!st || x.status===st)
    .sort((a,b)=>{
      if(sort==='due') return a.dueAt-b.dueAt;
      if(sort==='remaining') return hoursLeft(a.dueAt)-hoursLeft(b.dueAt);
      if(sort==='progress') return b.progress-a.progress;
      return 0;
    });

  rowsEl.innerHTML='';
  list.forEach(x=>{
    const dueCls = dueClass(x.dueAt);
    const remain = hoursLeft(x.dueAt);
    const remainTxt = remain<0 ? `지각 ${Math.abs(remain).toFixed(1)}h` : `${remain.toFixed(1)}h`;
    const stMap={ '미제출':'p0','진행중':'p1','제출':'p2','채점중':'p3','완료':'p4' };
    rowsEl.insertAdjacentHTML('beforeend', `
      <div class="row" role="button" onclick="openDrawer('${x.id}')">
        <div class="cell"><input type="checkbox" aria-label="select"/></div>
        <div class="cell"><span class="pill">${x.subject}</span></div>
        <div class="cell" title="${x.title}">${x.title}</div>
        <div class="cell"><span class="chip">${x.type}</span></div>
        <div class="cell due ${dueCls}">${fmtDate(x.dueAt)}</div>
        <div class="cell"><span class="badge">${remainTxt}</span></div>
        <div class="cell status ${stMap[x.status]}">${x.status}</div>
        <div class="cell">
          <div class="progress"><i style="width:${x.progress}%"></i></div>
        </div>
        <div class="cell">${x.score ?? '-'}</div>
      </div>
    `);
  });
}
fillSide(); render();

/* ---------- drawer ---------- */
function openDrawer(id){
  const x = data.find(v=>v.id===id); if(!x) return;
  document.getElementById('dwTitle').textContent = x.title;
  document.getElementById('dwSubj').textContent = x.subject;
  document.getElementById('dwType').textContent = x.type;
  document.getElementById('dwDue').textContent = fmtDate(x.dueAt);
  document.getElementById('dwStatus').textContent = x.status;
  document.getElementById('dwProg').style.width = x.progress + '%';
  const ul = document.getElementById('dwList'); ul.innerHTML='';
  x.checklist.forEach((t,i)=>{
    const ck = x.done?.[i] ? 'checked' : '';
    ul.insertAdjacentHTML('beforeend', `<li><input type="checkbox" ${ck} disabled><span>${t}</span></li>`);
  });
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer(){ document.getElementById('drawer').classList.remove('open'); }
document.getElementById('drawer').addEventListener('click',e=>{
  if(e.target.id==='drawer') closeDrawer();
});
</script>
</body>
</html>
