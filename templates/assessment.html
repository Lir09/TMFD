<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>수행평가 관리 · TMFD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/assessment.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="page-head">
      <div>
        <a href="/" style="text-decoration:none;color:inherit;cursor:pointer;">
          <div class="page-title">수행평가 관리 <span id="roleBadge" class="role-badge hidden"></span></div>
        </a>
        <div class="page-sub">상단 과목 탭 선택 → 아래서 과제 현황 관리</div>
      </div>
      <div id="today"></div>
    </div>

    <!-- 관리자 전용 컨트롤 -->
    <div id="adminControls" class="admin-controls">
      <button class="btn-admin" id="addBtn">
        📝 새 과제 추가
      </button>
      <button class="btn-admin btn-danger" onclick="deleteSelectedAssignments()">
        🗑️ 선택 항목 삭제
      </button>
      <span style="color: #666; font-size: 14px;">
        관리자 전용 기능
      </span>
    </div>

    <!-- Tabs -->
    <nav class="tabs" id="tabs" aria-label="과목 선택">
      <button class="tab is-active" data-emoji="📚" data-subj="ALL" aria-label="모든 과목">모든 과목</button>
      <button class="tab" data-emoji="🅰️" data-subj="국어" aria-label="국어">국어</button>
      <button class="tab" data-emoji="➗" data-subj="수학" aria-label="수학">수학</button>
      <button class="tab" data-emoji="✏️" data-subj="영어" aria-label="영어">영어</button>
      <button class="tab" data-emoji="🌏" data-subj="사회" aria-label="사회">사회</button>
      <button class="tab" data-emoji="🧪" data-subj="과학" aria-label="과학">과학</button>
      <button class="tab" data-emoji="🏛️" data-subj="한국사" aria-label="한국사">한국사</button>
      <button class="tab" data-emoji="💻" data-subj="정보" aria-label="정보">정보</button>
      <button class="tab" data-emoji="🔬" data-subj="과탐실" aria-label="과탐실">과탐실</button>
      <span class="spacer"></span>
    </nav>

    <!-- Filter bar / Toolbar -->
    <section class="filterbar" role="region" aria-label="필터">
      <input id="q" class="input" type="search" placeholder="과제명/키워드 검색 (전과목 가능)" aria-label="과제명/키워드 검색">
      <select id="status" class="select" aria-label="상태">
        <option value="">상태 전체</option>
        <option>미제출</option><option>진행중</option><option>제출</option><option>채점중</option><option>완료</option>
      </select>
      <select id="sort" class="select" aria-label="정렬">
        <option value="due">마감일 오름차순</option>
        <option value="remaining">남은시간 오름차순</option>
        <option value="progress">진행률 내림차순</option>
      </select>
      <button class="btn" id="clear">필터 초기화</button>
      <span class="spacer"></span>
    </section>

    <!-- Main Grid -->
    <div class="grid">
      <!-- Main board -->
      <section class="card" aria-label="과제 현황">
        <div class="card-hd">과제 현황</div>
        <div class="card-bd">
          <div class="hint">체크 → 일괄 작업(추가 예정). 행 클릭 → 상세 보기. '모든 과목' 탭에서 통합 검색/정렬 가능.</div>
          <div class="list">
            <div class="row head" aria-hidden="true">
              <div>선택</div><div>과목</div><div>과제명</div><div>유형</div><div>마감</div><div>남은시간</div>
            </div>
            <div id="rows"></div>
            <div id="empty" class="empty hidden">데이터가 없습니다.</div>
            <div id="needClass" class="empty hidden">학급에 배정되지 않았습니다. 관리자에게 문의하세요.</div>
          </div>
        </div>
      </section>

      <!-- Right panel -->
      <aside class="side" aria-label="사이드바">
        <div class="card">
          <div class="card-hd">오늘 할 일</div>
          <div class="card-bd" id="todayList"></div>
        </div>
        <div class="card">
          <div class="card-hd">임박(48h)</div>
          <div class="card-bd" id="soonList"></div>
        </div>
        <div class="card">
          <div class="card-hd">지각</div>
          <div class="card-bd" id="lateList"></div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Detail Drawer -->
  <div class="drawer" id="drawer" role="dialog" aria-modal="true">
    <div class="pane">
      <header>
        <div class="title" id="dwTitle"></div>
        <div id="dwActions" style="display:flex;gap:8px"></div>
      </header>
      <div class="body">
        <div class="kv"><div class="muted">과목</div><div id="dwSubj"></div></div>
        <div class="kv"><div class="muted">유형</div><div id="dwType"></div></div>
        <div class="kv"><div class="muted">마감일</div><div id="dwDue"></div></div>
        <div class="kv"><div class="muted">상태</div><div id="dwStatus"></div></div>
        <div class="kv">
          <div class="muted">진행률</div>
          <div><div class="progress"><i id="dwProg" style="width:0%"></i></div></div>
        </div>
        <div>
          <div class="muted" style="margin-bottom:6px">체크리스트</div>
          <ul class="checklist" id="dwList"></ul>
        </div>
        <div class="muted" style="margin-top:6px">제출/재제출, 루브릭, 코멘트 기능은 백엔드 연동 시 활성화 예정.</div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
          <button class="btn" id="dwClose">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 과제 추가 Drawer -->
  <div class="drawer" id="addDrawer" role="dialog" aria-modal="true">
    <div class="pane">
      <header>
        <div class="title">새 과제 추가</div>
        <button id="addClose" class="btn" style="padding:6px 10px">✕</button>
      </header>
      <div class="body">
        <div class="form-group">
          <label class="muted">과목</label>
          <select id="adSubject" class="input">
            <option value="">선택하세요</option>
            <option value="국어">국어</option>
            <option value="수학">수학</option>
            <option value="영어">영어</option>
            <option value="사회">사회</option>
            <option value="과학">과학</option>
            <option value="한국사">한국사</option>
            <option value="정보">정보</option>
            <option value="과탐실">과탐실</option>
          </select>
        </div>
        
        <div class="form-group" style="margin-top:12px">
          <label class="muted">과제명</label>
          <input id="adTitle" class="input" type="text" placeholder="과제 제목" />
        </div>
        
        <div class="form-group" style="margin-top:12px">
          <label class="muted">유형</label>
          <select id="adType" class="input">
            <option value="발표">발표</option>
            <option value="보고서">보고서</option>
            <option value="실험">실험</option>
            <option value="코딩">코딩</option>
            <option value="기타">기타</option>
          </select>
        </div>
        
        <div class="form-group" style="margin-top:12px">
          <label class="muted">마감일시</label>
          <input id="adDue" class="input" type="datetime-local" />
        </div>
        
        <div class="form-group" style="margin-top:12px">
          <label class="muted">상태</label>
          <select id="adStatus" class="input">
            <option value="미제출">미제출</option>
            <option value="진행중">진행중</option>
            <option value="제출">제출</option>
            <option value="채점중">채점중</option>
            <option value="완료">완료</option>
          </select>
        </div>
        
        <div class="form-group" style="margin-top:12px">
          <label class="muted">진행률 (%)</label>
          <input id="adProg" class="input" type="number" min="0" max="100" value="0" />
        </div>
        
        <div class="form-group" style="margin-top:12px">
          <label class="muted">체크리스트 (줄바꿈으로 구분)</label>
          <textarea id="adList" class="input" rows="4" placeholder="항목1&#10;항목2&#10;항목3"></textarea>
        </div>
        
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
          <button class="btn" id="addCancel">취소</button>
          <button class="btn primary" id="addCreate">추가하기</button>
        </div>
      </div>
    </div>
  </div>

  <style>
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 13px; }
    .form-group .input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
    }
  </style>

  <div class="toast" id="toast"></div>
  <script src="/static/js/assessment.js"></script>
</body>
</html>
