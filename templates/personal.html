<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>개인 일정 · TMFD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#ffffff; --panel:#fafafa; --ink:#141414; --muted:#666; --line:#e8e8e8; --accent:#3b82f6; --accent-2:#16a34a; --warn:#ef4444;
      --code-bg:#0f172a; --code-ink:#e5e7eb; --callout:#fffbe6; --toggle:#f2f7ff;
    }
    *{box-sizing:border-box}
    html, body { height: 100%; }
    body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter','Noto Sans KR',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    button,input,select,textarea{ font:inherit }

    .app{ display:grid; grid-template-columns:260px 1fr; height:100dvh; }
    .sidebar{ border-right:1px solid var(--line); background:#fff; display:flex; flex-direction:column; }
    .side-top{ padding:12px 12px 8px; display:flex; gap:8px; align-items:center; }
    .brand{ font-weight:700; letter-spacing:0.2px; }
    .search{ margin:8px 12px; }
    .search input{ width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--panel); }
    .page-list{ overflow:auto; padding:6px 6px 80px; }
    .page-item{ display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; cursor:pointer; user-select:none; }
    .page-item:hover{ background:var(--panel); }
    .page-item.active{ background:#edf3ff; outline:1px solid #dbe7ff }
    .page-emoji{ font-size:18px; }
    .side-actions{ margin:8px 12px 12px; display:flex; gap:8px; }
    .btn{ padding:8px 10px; border:1px solid var(--line); background:#fff; border-radius:8px; cursor:pointer; }
    .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }

    .main{ display:grid; grid-template-rows:auto 1fr; min-width:0; }
    .topbar{ display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); background:#fff; }
    .crumbs{ color:var(--muted); font-size:12px; }
    .spacer{ flex:1 }
    .hint{ color:var(--muted); font-size:12px; }

    .page{ overflow:auto; padding:40px 0 120px; }
    .page-inner{ max-width:860px; margin:0 auto; padding:0 24px; }

    .title-row{ display:flex; align-items:center; gap:12px; }
    .page-icon{ font-size:36px; cursor:pointer; }
    .page-title{ font-size:36px; font-weight:700; line-height:1.2; border:none; outline:none; width:100%; background:transparent; }
    .cover{ width:100%; height:180px; border-radius:12px; background:linear-gradient(120deg,#c3e7ff,#fce7f3); margin:8px 0 24px; position:relative; overflow:hidden; }
    .cover.small{ height:100px }

    /* Editor */
    #editor{ outline:none; min-height:220px; padding:2px; }
    #editor:empty:before{ content:'여기에 입력하세요... / 로 블록 메뉴 열기'; color:#666; }
    #editor p{ margin:6px 0; line-height:1.7; }

    /* 제목 크기 변수 적용 */
    #editor h1{ font-size: var(--h1, 28px); margin:16px 0 6px; }
    #editor h2{ font-size: var(--h2, 22px); margin:14px 0 4px; }
    #editor h3{ font-size: var(--h3, 18px); margin:12px 0 2px; }
    #editor h4{ font-size: var(--h4, 16px); margin:10px 0 2px; }
    #editor h5{ font-size: var(--h5, 14px); margin:8px 0 2px; }
    #editor h6{ font-size: var(--h6, 13px); margin:8px 0 2px; }

    #editor blockquote{ border-left:4px solid #ddd; padding:6px 12px; margin:10px 0; color:#333; background:#fafafa; border-radius:6px; }
    #editor hr{ border:none; border-top:1px solid var(--line); margin:14px 0; }

    .todo{ display:flex; align-items:flex-start; gap:10px; margin:6px 0; }
    .todo input{ transform:translateY(4px) scale(1.15); }
    .todo span[contenteditable]{ display:inline-block; min-width:8px; }

    ul,ol{ padding-left:28px; margin:6px 0; }
    li{ margin:4px 0; }

    .callout{ display:flex; gap:10px; background:var(--callout); border:1px solid #f3e8a3; border-radius:10px; padding:12px; margin:10px 0; }
    .callout .ico{ font-size:18px }
    .callout .text[contenteditable]{ flex:1; }

    pre{ background:var(--code-bg); color:var(--code-ink); padding:12px 14px; border-radius:10px; overflow:auto; margin:10px 0; }
    pre code{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; white-space: pre; }

    details.toggle{ background:var(--toggle); border:1px solid #e7f0ff; border-radius:10px; padding:8px 10px; margin:8px 0; }
    details.toggle summary{ cursor:pointer; font-weight:600; }
    details.toggle .tcontent{ margin:8px 0 0; }

    figure.image{ margin:10px 0; }
    figure.image img{ max-width:100%; border-radius:10px; display:block; }
    figure.image figcaption{ font-size:12px; color:var(--muted); margin-top:6px; }

    .slash{ position:fixed; z-index:2000; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.08); padding:8px; width:280px; display:none; max-height:min(56vh,420px); overflow-y:auto; }
    .slash .row{ display:flex; gap:10px; align-items:center; padding:8px; border-radius:8px; cursor:pointer; }
    .slash .row:hover, .slash .row.active{ background:#f5f7ff; }
    .slash .row .k{ font-weight:700; width:22px; text-align:center; }
    .slash .row .d{ font-size:12px; color:var(--muted); }

    .modal{ position:fixed; inset:0; background:rgba(0,0,0,.3); display:none; align-items:center; justify-content:center; z-index:3000; }
    .modal .box{ background:#fff; border-radius:12px; min-width:320px; max-width:90vw; padding:16px; }
    .modal h3{ margin:0 0 10px; }

    .kbd{ font-family:ui-monospace,Menlo,Consolas,monospace; border:1px solid var(--line); padding:2px 6px; border-radius:6px; background:#f7f7f7; }

    @media (max-width: 900px){ .app{ grid-template-columns:1fr } .sidebar{ display:none } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="side-top">
        <div class="brand" onclick="location.href='index.html'">🧠 개인 노트</div>
        <div class="spacer"></div>
        <button class="btn" id="toggleCoverBtn">커버 높이</button>
      </div>
      <div class="search"><input id="search" placeholder="전체 검색 (Ctrl+K)"/></div>
      <div class="side-actions">
        <button class="btn primary" id="newPageBtn">새 페이지</button>
      </div>
      <div class="page-list" id="pageList"></div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="crumbs" id="crumbs">내 노트</div>
        <div class="spacer"></div>
        <div class="hint">힌트: <span class="kbd">/</span> 블록, <span class="kbd">Ctrl</span>+<span class="kbd">K</span> 검색</div>
      </div>

      <section class="page">
        <div class="page-inner">
          <div class="cover" id="cover"></div>
          <div class="title-row">
            <div class="page-icon" id="pageIcon" title="아이콘 변경">📄</div>
            <input class="page-title" id="pageTitle" placeholder="제목 없음"/>
          </div>
          <div id="editor" contenteditable spellcheck="false"></div>
        </div>
      </section>
    </main>
  </div>

  <div class="slash" id="slash"></div>

  <div class="modal" id="searchModal">
    <div class="box">
      <h3>전체 검색</h3>
      <input style="width:100%; padding:10px; border:1px solid var(--line); border-radius:8px;" id="searchInput" placeholder="키워드" />
      <div id="searchResults" style="max-height:50vh; overflow:auto; margin-top:10px;"></div>
    </div>
  </div>

<script>
(() => {
  const $  = (s, el=document)=>el.querySelector(s);
  const $$ = (s, el=document)=>Array.from(el.querySelectorAll(s));
  const escapeHtml = s => { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; };
  const insertAfter = (newNode, refNode)=> refNode.parentNode.insertBefore(newNode, refNode.nextSibling);
  function debounce(fn, ms=400){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }
  async function fetchJSON(url, opts={}){ const res=await fetch(url,{credentials:'same-origin',...opts}); if(!res.ok){ let m=''; try{m=(await res.json()).error||res.statusText;}catch{}; throw new Error(`[${res.status}] ${m}`);} return res.status===204?null:res.json(); }
  function htmlToNode(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
  function setCaretTo(el){
    const r=document.createRange(), s=window.getSelection();
    let n=el.firstChild||el;
    if(n===el && el.childNodes.length===0){ n=document.createTextNode(''); el.appendChild(n); }
    r.setStart(n, n.nodeType===3 ? n.length : 0);
    r.collapse(true); s.removeAllRanges(); s.addRange(r);
  }
  function insertNode(node){
    const sel=window.getSelection();
    if(!sel||!sel.rangeCount){ editorEl?.appendChild(node); setCaretTo(node); savePageHtmlDebounced(); return; }
    const range=sel.getRangeAt(0); range.collapse(true); range.insertNode(node);
    setCaretTo(node); savePageHtmlDebounced();
  }

  /* ===== 상태/DOM ===== */
  const STORE_KEY = 'ns-notes-settings-v1';
  let state = { currentPageId:null, pageOrder:[], pages:{}, settings:{ headingSizes:{h1:28,h2:22,h3:18,h4:16,h5:14,h6:13} } };
  try { const raw=localStorage.getItem(STORE_KEY); if(raw){ const obj=JSON.parse(raw); if(obj?.settings?.headingSizes) state.settings=obj.settings; } } catch {}
  function saveSettings(){ localStorage.setItem(STORE_KEY, JSON.stringify({settings:state.settings})); }

  const pageListEl = $('#pageList');
  const pageTitleEl= $('#pageTitle');
  const pageIconEl = $('#pageIcon');
  const editorEl   = $('#editor');
  const crumbsEl   = $('#crumbs');
  const coverEl    = $('#cover');
  const slashEl    = $('#slash');
  const searchModal= $('#searchModal');

  /* ===== Heading size ===== */
  function applyHeadingSizes(){
    const s=state.settings.headingSizes, rt=document.documentElement;
    rt.style.setProperty('--h1', s.h1+'px'); rt.style.setProperty('--h2', s.h2+'px'); rt.style.setProperty('--h3', s.h3+'px');
    rt.style.setProperty('--h4', s.h4+'px'); rt.style.setProperty('--h5', s.h5+'px'); rt.style.setProperty('--h6', s.h6+'px');
  }

  /* ===== 빈 에디터 보정 ===== */
  function ensureParagraph(){
    if(!editorEl) return;
    const hasBlock = editorEl.querySelector('h1,h2,h3,h4,h5,h6,p,ul,ol,blockquote,pre,details,.table,.todo');
    if(!hasBlock){
      editorEl.innerHTML = '<p><br></p>';
    }
  }
  function getCurrentBlockOrCreate(){
    const sel=getSelection(); if(!sel||!sel.rangeCount) { ensureParagraph(); return editorEl.querySelector('p, h1, h2, h3, h4, h5, h6'); }
    let el=sel.anchorNode; if(!el) { ensureParagraph(); return editorEl.querySelector('p'); }
    if(el.nodeType===3) el=el.parentElement;
    if(!editorEl.contains(el)){ ensureParagraph(); return editorEl.querySelector('p'); }
    const blk = el.closest('h1,h2,h3,h4,h5,h6,p,li,blockquote p,div');
    if(blk) return blk;
    const p=document.createElement('p'); editorEl.appendChild(p); setCaretTo(p); return p;
  }

  /* ===== 사이드바 ===== */
  function renderSidebar(){
    pageListEl.innerHTML='';
    state.pageOrder.forEach(pid=>{
      const p=state.pages[pid];
      const item=document.createElement('div');
      item.className='page-item'+(pid===state.currentPageId?' active':'');
      item.dataset.id=pid;
      item.innerHTML=`<div class="page-emoji">${p.icon||'📄'}</div><div class="t" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(p.title||'제목 없음')}</div>`;
      item.addEventListener('click', ()=> openPage(pid));
      item.addEventListener('dblclick', ()=> renamePage(pid));
      item.addEventListener('contextmenu', e=>{e.preventDefault(); showPageContext(e.clientX,e.clientY,pid);});
      pageListEl.appendChild(item);
    });
  }
  async function openPage(pid){
    state.currentPageId=pid;
    const p=state.pages[pid];
    pageTitleEl.value=p.title||'';
    pageIconEl.textContent=p.icon||'📄';
    editorEl.innerHTML=p.html||'';
    coverEl.classList.toggle('small', !!p.coverSmall);
    crumbsEl.textContent='내 노트 / '+(p.title||'제목 없음');
    ensureParagraph();
    setTimeout(()=>{ const blk = editorEl.querySelector('h1,h2,h3,h4,h5,h6,p,li,blockquote p') || editorEl; setCaretTo(blk); }, 0);
    renderSidebar();
  }
  async function renamePage(pid){
    const t=prompt('페이지 이름', state.pages[pid].title||''); if(t==null) return;
    state.pages[pid].title=(t.trim()||'제목 없음'); await savePageHtml(); renderSidebar();
  }
  function showPageContext(x,y,pid){
    const menu=document.createElement('div');
    menu.style.cssText=`position:fixed;left:${x}px;top:${y}px;background:#fff;border:1px solid #e8e8e8;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.08);z-index:4000;`;
    menu.innerHTML=`<div style="padding:8px;min-width:160px;">
      <div class="ctxrow" data-act="rename" style="padding:8px;border-radius:8px;cursor:pointer;">이름 바꾸기</div>
      <div class="ctxrow" data-act="duplicate" style="padding:8px;border-radius:8px;cursor:pointer;">복제</div>
      <div class="ctxrow" data-act="delete" style="padding:8px;border-radius:8px;cursor:pointer;color:#ef4444">삭제</div>
    </div>`;
    document.body.appendChild(menu);
    const close=()=>menu.remove(); setTimeout(()=>document.addEventListener('click',close,{once:true}),0);
    menu.addEventListener('click', async e=>{
      const act=e.target.closest('.ctxrow')?.dataset.act; if(!act) return;
      if(act==='rename') renamePage(pid);
      if(act==='duplicate') duplicatePage(pid);
      if(act==='delete') deletePage(pid);
    });
  }

  /* ===== 서버 연동 ===== */
  async function bootstrapNotes(){
    let notes = await fetchJSON('/api/notes');
    if(!Array.isArray(notes)) notes=[];
    if(notes.length===0){
      const created=await fetchJSON('/api/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'새 페이지',content:''})});
      notes=[created];
    }
    state.pages={}; state.pageOrder=notes.map(n=>String(n.id));
    for(const n of notes){ state.pages[String(n.id)]={id:String(n.id),icon:'📄',title:n.title||'제목 없음',coverSmall:false,html:n.content||''}; }
    state.currentPageId=state.pageOrder[0];
    renderSidebar(); openPage(state.currentPageId);
  }
  async function savePageHtml(){
    const pid=state.currentPageId, p=state.pages[pid];
    p.title=pageTitleEl.value.trim(); p.icon=pageIconEl.textContent||'📄'; p.html=editorEl.innerHTML;
    saveSettings();
    try{ await fetchJSON(`/api/notes/${pid}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:p.title||'',content:p.html||''})}); }
    catch(e){ console.warn('서버 저장 실패:', e.message); }
  }
  const savePageHtmlDebounced = debounce(savePageHtml, 500);
  window.savePageHtmlDebounced = savePageHtmlDebounced;

  async function duplicatePage(pid){
    const src=state.pages[pid];
    try{
      const created=await fetchJSON('/api/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:(src.title||'제목 없음')+' 사본',content:src.html||''})});
      const npid=String(created.id);
      state.pages[npid]={id:npid,icon:src.icon,title:created.title,coverSmall:!!src.coverSmall,html:created.content||''};
      const idx=state.pageOrder.indexOf(pid); state.pageOrder.splice(idx+1,0,npid);
      renderSidebar(); openPage(npid);
    }catch(e){ alert('복제 실패: '+e.message); }
  }
  async function deletePage(pid){
    if(state.pageOrder.length<=1){ alert('최소 1개의 페이지는 남아 있어야 합니다.'); return; }
    if(!confirm('삭제하시겠어요?')) return;
    try{ await fetchJSON(`/api/notes/${pid}`,{method:'DELETE'}); }
    catch(e){ alert('삭제 실패: '+e.message); return; }
    const idx=state.pageOrder.indexOf(pid); state.pageOrder.splice(idx,1);
    delete state.pages[pid];
    const next=state.pageOrder[Math.max(0,idx-1)]||state.pageOrder[0];
    renderSidebar(); openPage(next);
  }
  window.deletePage = deletePage;

  /* ===== Slash 메뉴 ===== */
  const SLASH_ITEMS = [
    {k:'텍스트',v:'p',d:'기본 문단'},
    {k:'제목 1',v:'h1',d:'#'},{k:'제목 2',v:'h2',d:'##'},{k:'제목 3',v:'h3',d:'###'},
    {k:'제목 4',v:'h4',d:'####'},{k:'제목 5',v:'h5',d:'#####'},{k:'제목 6',v:'h6',d:'######'},
    {k:'할 일',v:'todo',d:'[ ] 체크박스'},{k:'글머리',v:'ul',d:'- 목록'},{k:'번호목록',v:'ol',d:'1. 목록'},
    {k:'인용문',v:'quote',d:'> 인용'},{k:'구분선',v:'hr',d:'---'},{k:'코드 블록',v:'code',d:'```'},
    {k:'콜아웃',v:'callout',d:'💡 강조'},{k:'토글',v:'toggle',d:'접기/펼치기'},
    {k:'표',v:'table',d:'2×3 표'}
  ];
  function iconFor(v){ return ({h1:'H1',h2:'H2',h3:'H3',h4:'H4',h5:'H5',h6:'H6',p:'¶',ul:'•',ol:'1',hr:'—',quote:'❝',code:'</>',callout:'⚑',todo:'☑',toggle:'▸',table:'▦'})[v]||'+'; }
  let slashActiveIndex=0, slashRange=null;
  function openSlashMenu(x,y,filter=''){
    const items=SLASH_ITEMS.filter(it=> it.k.includes(filter) || it.v.includes(filter) );
    slashEl.innerHTML=items.map((it,i)=>`
      <div class="row ${i===0?'active':''}" data-v="${it.v}">
        <div class="k" style="width:28px;text-align:center">${iconFor(it.v)}</div>
        <div><div>${it.k}</div><div class="d">${it.d}</div></div>
      </div>`).join('');
    slashEl.style.display='block';
    const pad=8, vw=innerWidth, vh=innerHeight;
    slashEl.style.left=x+'px'; slashEl.style.top=y+'px';
    const rect=slashEl.getBoundingClientRect(), left=Math.min(Math.max(pad,x),vw-rect.width-pad);
    let top=Math.min(Math.max(pad,y),vh-rect.height-pad);
    if(rect.bottom>vh-pad) top=Math.max(pad,vh-rect.height-pad);
    slashEl.style.left=left+'px'; slashEl.style.top=top+'px';
    slashActiveIndex=0;
    Array.from(slashEl.children).forEach((row,i)=>{
      row.addEventListener('mouseenter',()=>{ Array.from(slashEl.children)[slashActiveIndex]?.classList.remove('active'); slashActiveIndex=i; row.classList.add('active'); });
      row.addEventListener('mousedown', e=>e.preventDefault());
      row.addEventListener('click', ()=> applySlashSelect(items[i].v));
    });
  }
  function closeSlashMenu(){ slashEl.style.display='none'; slashRange=null; }
  function setActive(i){ const rows=Array.from(slashEl.children); rows[slashActiveIndex]?.classList.remove('active'); slashActiveIndex=(i+rows.length)%rows.length; rows[slashActiveIndex]?.classList.add('active'); const r=rows[slashActiveIndex].getBoundingClientRect(), m=slashEl.getBoundingClientRect(); if(r.top<m.top) slashEl.scrollTop-= (m.top-r.top)+4; if(r.bottom>m.bottom) slashEl.scrollTop+= (r.bottom-m.bottom)+4; }
  function getSlashWord(){ if(!slashRange) return null; const rect=slashRange.getBoundingClientRect(); const text=slashRange.toString(); return [text.replace(/^\//,''), {x:rect.left+scrollX, y:rect.top+scrollY}]; }
  function showSlashForCaret(){
    const sel=getSelection(); if(!sel.rangeCount) return;
    const range=sel.getRangeAt(0).cloneRange(); range.collapse(true);
    let node=range.startContainer, start=range.startOffset;
    if(node.nodeType!==3){ if(node.firstChild && node.firstChild.nodeType===3){ node=node.firstChild; start=node.length; } else { const t=document.createTextNode(''); node.appendChild(t); node=t; start=0; } }
    const text=node.textContent; let i=start-1, buf='';
    while(i>=0 && text[i]!=='\n' && text[i]!==' '){ buf=text[i]+buf; if(text[i]==='/') break; i--; }
    if(!buf.startsWith('/')) return closeSlashMenu();
    const r2=document.createRange(); r2.setStart(node,i); r2.setEnd(node,start); slashRange=r2;
    const rect=r2.getBoundingClientRect(); openSlashMenu(rect.left+scrollX, rect.top+scrollY, buf.slice(1));
  }

  /* ===== 블록 생성 helper ===== */
  const createCallout = () => htmlToNode('<div class="callout"><div class="ico">💡</div><div class="text" contenteditable>콜아웃 텍스트</div></div>');
  const createTodo    = () => htmlToNode('<label class="todo"><input type="checkbox"><span contenteditable>할 일</span></label>');
  const createToggle  = () => htmlToNode('<details class="toggle" open><summary contenteditable>토글 제목</summary><div class="tcontent" contenteditable>토글 내용</div></details>');

  /* ===== 변환 util ===== */
  function stripMdPrefixFromText(text){
    return text
      .replace(/^\s*#{1,6}\s+/, '')
      .replace(/^\s*>\s+/, '')
      .replace(/^\s*[-*]\s+/, '')
      .replace(/^\s*\d+\.\s+/, '')
      .replace(/^\s*\[\s?\]\s+/, '');
  }
  function startsWithMdToken(text){
    return (/^\s*#{1,6}\s+/.test(text) || /^\s*>\s+/.test(text) || /^\s*[-*]\s+/.test(text) || /^\s*\d+\.\s+/.test(text) || /^\s*\[\s?\]\s+/.test(text));
  }

  function transformBlock(blk,tag){
    const n=document.createElement(tag);
    const text=blk.textContent||'';
    if(startsWithMdToken(text)) n.textContent = stripMdPrefixFromText(text);
    else n.innerHTML = blk.innerHTML;
    blk.replaceWith(n); setCaretTo(n); savePageHtmlDebounced();
  }
  function wrapAsList(blk,tag){
    const ul=document.createElement(tag), li=document.createElement('li');
    const text=blk.textContent||'';
    li.innerHTML = startsWithMdToken(text) ? escapeHtml(stripMdPrefixFromText(text)) : blk.innerHTML;
    ul.appendChild(li); blk.replaceWith(ul); setCaretTo(li); savePageHtmlDebounced();
  }
  function transformToQuote(blk){
    const bq=htmlToNode('<blockquote><p></p></blockquote>');
    const p=bq.querySelector('p'); const text=blk.textContent||'';
    p.innerHTML = startsWithMdToken(text) ? escapeHtml(stripMdPrefixFromText(text)) : blk.innerHTML;
    blk.replaceWith(bq); setCaretTo(p); savePageHtmlDebounced();
  }
  function transformToTodo(blk){
    const todo=createTodo();
    const span=todo.querySelector('span'); const text=blk.textContent||'';
    span.innerHTML = startsWithMdToken(text) ? escapeHtml(stripMdPrefixFromText(text)) : blk.innerHTML;
    blk.replaceWith(todo); setCaretTo(span); savePageHtmlDebounced();
  }

  function applySlashSelect(v){
    if(!slashRange) return closeSlashMenu();
    const sel=getSelection(); sel.removeAllRanges(); sel.addRange(slashRange); document.execCommand('delete');
    switch(v){
      case 'p': insertNode(htmlToNode('<p></p>')); break;
      case 'h1': case 'h2': case 'h3': case 'h4': case 'h5': case 'h6': {
        const blk=getCurrentBlockOrCreate(); transformBlock(blk,v); break;
      }
      case 'ul': insertNode(htmlToNode('<ul><li></li></ul>')); break;
      case 'ol': insertNode(htmlToNode('<ol><li></li></ol>')); break;
      case 'quote': insertNode(htmlToNode('<blockquote><p></p></blockquote>')); break;
      case 'hr': insertNode(htmlToNode('<hr>')); break;
      case 'code': insertNode(htmlToNode('<pre><code contenteditable>여기에 코드</code></pre>')); break;
      case 'callout': insertNode(createCallout()); break;
      case 'todo': insertNode(createTodo()); break;
      case 'toggle': insertNode(createToggle()); break;
      case 'table': insertNode(createTable(2,3)); break;
    }
    closeSlashMenu();
  }
  window.applySlashSelect = applySlashSelect;

  /* ===== 표 ===== */
  function createTable(rows=2, cols=3){
    const wrap=document.createElement('div'); wrap.className='table'; wrap.contentEditable='false';
    const rowsHtml=Array.from({length:rows}).map(()=>`<tr>${Array.from({length:cols}).map(()=>'<td contenteditable></td>').join('')}</tr>`).join('');
    wrap.innerHTML=`
      <div class="tbl-actions" style="display:flex;gap:6px;padding:8px;border-bottom:1px solid #e8e8e8;background:#f8fafc;position:sticky;top:0;z-index:1;">
        <button class="mini" data-act="add-row">+ 행</button>
        <button class="mini" data-act="add-col">+ 열</button>
        <button class="mini" data-act="del-row">행 삭제</button>
        <button class="mini" data-act="del-col">열 삭제</button>
      </div>
      <table style="width:100%; border-collapse:collapse;"><tbody>${rowsHtml}</tbody></table>
      <div class="tbl-caption" contenteditable style="color:#666;font-size:12px;padding:8px 10px;border-top:1px solid #e8e8e8;">표 설명</div>
    `;
    setTimeout(()=> wrap.querySelector('td[contenteditable]')?.focus(), 0);
    return wrap;
  }
  let lastCell=null;
  if(editorEl){
    editorEl.addEventListener('focusin', e=>{ const td=e.target.closest?.('td'); if(td) lastCell=td; });
    editorEl.addEventListener('click', e=>{
      const btn=e.target.closest?.('.tbl-actions .mini'); if(!btn) return;
      const tableWrap=btn.closest('.table'); const tbody=tableWrap.querySelector('tbody');
      if(btn.dataset.act==='add-row'){
        const cols=tbody.querySelector('tr')?.children.length||1;
        const tr=document.createElement('tr'); tr.innerHTML=Array.from({length:cols}).map(()=>'<td contenteditable></td>').join(''); tbody.appendChild(tr);
      }
      if(btn.dataset.act==='add-col'){ tbody.querySelectorAll('tr').forEach(tr=>{ const td=document.createElement('td'); td.setAttribute('contenteditable',''); tr.appendChild(td); }); }
      if(btn.dataset.act==='del-row'){ const tr=lastCell?.closest('tr')||tbody.lastElementChild; tr?.remove(); }
      if(btn.dataset.act==='del-col'){ const colIdx=lastCell?Array.from(lastCell.parentElement.children).indexOf(lastCell):-1; if(colIdx>=0){ tbody.querySelectorAll('tr').forEach(tr=> tr.children[colIdx]?.remove()); } }
      savePageHtmlDebounced();
    });
  }

  /* ===== 검색 ===== */
  $('#search')?.addEventListener('keydown', e=>{ if(e.key==='Enter'){ openSearch(e.target.value.trim()); }});
  function openSearch(initial=''){ searchModal.style.display='flex'; $('#searchInput').value=initial; $('#searchInput').focus(); runSearch(initial); }
  searchModal?.addEventListener('click', e=>{ if(e.target===searchModal) searchModal.style.display='none'; });
  $('#searchInput')?.addEventListener('input', e=> runSearch(e.target.value.trim()) );
  function runSearch(q){
    const box=$('#searchResults'); box.innerHTML=''; if(!q){ box.innerHTML='<div style="color:#666">검색어를 입력하세요</div>'; return; }
    const results=[];
    for(const pid of state.pageOrder){
      const p=state.pages[pid]; const text=(p.title+'\n'+p.html.replace(/<[^>]+>/g,' ')).toLowerCase();
      if(text.includes(q.toLowerCase())){
        const plain=(p.html.replace(/<[^>]+>/g,' ')), idx=plain.toLowerCase().indexOf(q.toLowerCase()), snippet=plain.slice(Math.max(0,idx-30), idx+70);
        results.push({pid, title:p.title||'제목 없음', snippet});
      }
    }
    if(!results.length){ box.innerHTML='<div>결과 없음</div>'; return; }
    results.forEach(r=>{
      const item=document.createElement('div'); item.style.cssText='padding:8px;border-radius:8px;cursor:pointer;';
      item.innerHTML=`<div style="font-weight:600">${escapeHtml(r.title)}</div><div style="color:#666;font-size:12px;">... ${escapeHtml(r.snippet)} ...</div>`;
      item.addEventListener('click', ()=>{ searchModal.style.display='none'; openPage(r.pid); });
      box.appendChild(item);
    });
  }

  /* ===== Enter 동작: 위젯 내부 → 아래에 "요소 추가" ===== */
  function getWidgetInfo(t){
    if(!t || !t.closest) return null;
    const ce = t.closest('[contenteditable]');
    if(!ce || ce === editorEl) return null;
    const root = ce.closest('.callout, details.toggle, label.todo, .table, pre');
    if(!root) return null;
    const type =
      root.matches('.callout') ? 'callout' :
      root.matches('details.toggle') ? 'toggle' :
      root.matches('label.todo') ? 'todo' :
      root.matches('.table') ? 'table' :
      root.matches('pre') ? 'code' : null;
    return {root, type, ce};
  }
  function insertParagraphAfter(node){
    const p = document.createElement('p');
    p.innerHTML = '<br>';
    insertAfter(p, node);
    setCaretTo(p);
    savePageHtmlDebounced();
  }

  if(editorEl){
    editorEl.addEventListener('focus', ensureParagraph);
    editorEl.addEventListener('click', ensureParagraph);
    editorEl.addEventListener('input', ()=> savePageHtmlDebounced());

    editorEl.addEventListener('keydown', (e)=>{
      // --- 커스텀 Enter: 위젯 내부에서 요소 추가 ---
      if(e.key === 'Enter'){
        const info = getWidgetInfo(e.target);
        if(info){
          e.preventDefault();

          // Shift+Enter: 현재 위젯 안 줄바꿈(텍스트 계속)
          if(e.shiftKey){
            if(e.target.closest('pre code[contenteditable]')){
              document.execCommand('insertText', false, '\n');
            }else{
              const ok = document.execCommand('insertLineBreak');
              if(!ok) document.execCommand('insertHTML', false, '<br>');
            }
            savePageHtmlDebounced();
            return;
          }

          // Enter: 아래에 "같은 타입" 요소 추가(표는 새 행, 코드블록은 새 문단)
          switch(info.type){
            case 'callout': {
              const nn = createCallout();
              insertAfter(nn, info.root);
              setCaretTo(nn.querySelector('.text[contenteditable]'));
              break;
            }
            case 'todo': {
              const nn = createTodo();
              insertAfter(nn, info.root);
              setCaretTo(nn.querySelector('span[contenteditable]'));
              break;
            }
            case 'toggle': {
              const nn = createToggle();
              insertAfter(nn, info.root);
              setCaretTo(nn.querySelector('summary[contenteditable]'));
              break;
            }
            case 'table': {
              const td = e.target.closest('td');
              const tr = td?.parentElement;
              const tbody = info.root.querySelector('tbody');
              if(tr && tbody){
                const cols = tr.children.length;
                const newTr = document.createElement('tr');
                newTr.innerHTML = Array.from({length:cols}).map(()=>'<td contenteditable></td>').join('');
                insertAfter(newTr, tr);
                setCaretTo(newTr.querySelector('td'));
              }else{
                insertParagraphAfter(info.root);
              }
              break;
            }
            case 'code': {
              insertParagraphAfter(info.root);
              break;
            }
          }
          savePageHtmlDebounced();
          return;
        }
      }
      // --- 기본 단축키/마크다운 트리거 ---
      if(e.key==='Tab'){
        if(document.activeElement.closest('li')) return;
        e.preventDefault(); document.execCommand('insertText', false, '    ');
      }
      if(e.key===' ' || e.key==='Enter'){
        const blk=getCurrentBlockOrCreate(); if(!blk) return;
        const text=blk.textContent.trim();
        if(/^#\s$/.test(text+' ')){ e.preventDefault(); return transformBlock(blk,'h1'); }
        if(/^##\s$/.test(text+' ')){ e.preventDefault(); return transformBlock(blk,'h2'); }
        if(/^###\s$/.test(text+' ')){ e.preventDefault(); return transformBlock(blk,'h3'); }
        if(/^####\s$/.test(text+' ')){ e.preventDefault(); return transformBlock(blk,'h4'); }
        if(/^#####\s$/.test(text+' ')){ e.preventDefault(); return transformBlock(blk,'h5'); }
        if(/^######\s$/.test(text+' ')){ e.preventDefault(); return transformBlock(blk,'h6'); }
        if(/^[-*]\s$/.test(text+' ')){ e.preventDefault(); return wrapAsList(blk,'ul'); }
        if(/^\d+\.$/.test(text))      { e.preventDefault(); return wrapAsList(blk,'ol'); }
        if(/^>\s$/.test(text+' '))    { e.preventDefault(); return transformToQuote(blk); }
        if(/^\[\s?\]\s$/.test(text+' ')) { e.preventDefault(); return transformToTodo(blk); }
        if(/^---$/.test(text)){ e.preventDefault(); blk.replaceWith(htmlToNode('<hr>')); const p=document.createElement('p'); insertAfter(p, blk); setCaretTo(p); savePageHtmlDebounced(); }
        if(/^```$/.test(text)){ e.preventDefault(); blk.replaceWith(htmlToNode('<pre><code contenteditable>여기에 코드</code></pre>')); savePageHtmlDebounced(); }
      }
      if(e.key==='/' && !e.ctrlKey && !e.metaKey){ setTimeout(()=> showSlashForCaret(), 0); }
      if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openSearch(); }
    });

    editorEl.addEventListener('keyup', (e)=>{
      if(slashEl && slashEl.style.display==='block'){
        const word=getSlashWord(); if(word==null) return closeSlashMenu();
        const [filter,pos]=word;
        const rows=Array.from(slashEl.children);
        if(e.key==='ArrowDown') return setActive(slashActiveIndex+1);
        if(e.key==='ArrowUp')   return setActive(slashActiveIndex-1);
        if(e.key==='Escape')    return closeSlashMenu();
        if(e.key==='Enter'){ const v=rows[slashActiveIndex]?.dataset.v; if(v) applySlashSelect(v); return; }
        openSlashMenu(pos.x, pos.y+18, filter);
      }
    });
  }
  document.addEventListener('click', e=>{ if(slashEl && !slashEl.contains(e.target)) closeSlashMenu(); });

  /* ===== Init ===== */
  (async function init(){ applyHeadingSizes(); await bootstrapNotes(); ensureParagraph(); })();
})();
</script>

</body>
</html>
