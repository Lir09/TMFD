<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>TMFD - 시간표</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    /* color */
    --bg:#f7f8fa;
    --surface:#ffffff;
    --ink:#111827;
    --muted:#6b7280;
    --line:#e5e7eb;
    --line-2:#f3f4f6;

    --brand:#22c55e;               /* primary */
    --brand-ink:#065f46;           /* brand text dark */
    --brand-surface:#f0fdf4;       /* brand tint */
    --brand-line:#bbf7d0;

    --accent:#fb923c;              /* now/active accent (주황) */
    --today-bg:#dcfce7;            /* 오늘 컬럼 */
    --now-bg:#fff7ed;              /* 현재 교시 행(연한 주황) */

    /* shape & depth */
    --radius:14px;
    --radius-2:999px;
    --shadow:0 6px 20px rgba(17,24,39,.06);

    /* type scale */
    --fs-12:12px; --fs-13:13px; --fs-14:14px; --fs-15:15px;
    --fs-16:16px; --fs-18:18px; --fs-20:20px; --fs-22:22px;

    /* spacing scale */
    --sp-4:4px; --sp-6:6px; --sp-8:8px; --sp-10:10px; --sp-12:12px;
    --sp-14:14px; --sp-16:16px; --sp-20:20px; --sp-24:24px; --sp-28:28px;
  }

  /* reduced motion respect */
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important}
  }

  /* base */
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Inter","Noto Sans KR",system-ui,-apple-system,Segoe UI,Roboto,"Apple SD Gothic Neo",sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }

  /* layout */
  .wrap{max-width:1100px;margin:var(--sp-28) auto;padding:0 var(--sp-16);}
  .header{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-12);margin-bottom:var(--sp-8);}
  .title{font-weight:800;letter-spacing:-0.3px;font-size:var(--fs-22);}
  .today-info{color:var(--muted);font-size:var(--fs-14);}

  .statusbar{display:flex;flex-wrap:wrap;gap:var(--sp-8);align-items:center;margin-bottom:var(--sp-16);}
  .badge{
    display:inline-flex;align-items:center;gap:var(--sp-6);
    border:1px solid var(--brand-line);background:var(--brand-surface);color:var(--brand-ink);
    padding:var(--sp-6) var(--sp-10);border-radius:var(--radius-2);font-weight:700;font-size:var(--fs-12);
    line-height:1; white-space:nowrap;
  }
  .badge.dim{background:#f9fafb;border-color:var(--line);color:var(--muted);}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-16);}
  @media (max-width:920px){ .grid{grid-template-columns:1fr;} }

  /* card */
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  }
  .table-card{padding:var(--sp-14);}
  .table-head{display:flex;align-items:center;justify-content:space-between;margin:0 var(--sp-6) var(--sp-8);}
  .hint{color:var(--muted);font-size:var(--fs-12);}

  /* table */
  .table-wrap{overflow:auto;border-radius:calc(var(--radius) - 6px);}
  table{width:100%;border-collapse:collapse;min-width:680px;}
  th,td{
    border:1px solid var(--line);text-align:center;vertical-align:middle;
    padding:var(--sp-10) var(--sp-6);font-size:var(--fs-16);line-height:1.2;
  }
  th{background:var(--line-2);font-weight:700;}
  td small{display:block;color:var(--muted);font-size:var(--fs-12);margin-top:var(--sp-4);}
  .period{width:90px;white-space:nowrap;font-weight:700;}
  .today-col{background:var(--today-bg);}
  .now-row td{background:var(--now-bg);}
  .subject-cell{position:relative;}
  .subject-pill{
    display:inline-block;padding:2px 10px;border-radius:var(--radius-2);
    background:#eef2f7;font-size:var(--fs-12);color:#0f172a;margin-bottom:var(--sp-4);
  }
  .free{color:#9ca3af;font-style:italic;}

  /* side list */
  .side{padding:var(--sp-16);}
  .side h3{margin:var(--sp-4) 0 var(--sp-10);font-size:var(--fs-16);}
  .day-badge{
    display:inline-flex;align-items:center;gap:var(--sp-8);
    background:var(--brand-surface);border:1px solid var(--brand-line);color:var(--brand-ink);
    padding:var(--sp-6) var(--sp-10);border-radius:var(--radius-2);font-weight:700;font-size:var(--fs-12);letter-spacing:.2px;
  }
  .list{margin-top:var(--sp-12);display:flex;flex-direction:column;gap:var(--sp-8);}
  .row{
    display:flex;gap:var(--sp-10);align-items:center;justify-content:space-between;
    border:1px solid var(--line);padding:var(--sp-10) var(--sp-12);border-radius:12px;background:var(--surface);
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .row:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 14px rgba(17,24,39,.06);
    border-color:#dbe0e6;
  }
  .row.now{outline:2px solid var(--accent); outline-offset:2px;}
  .row .left{display:flex;align-items:center;gap:var(--sp-10);min-width:0;}
  .chip{
    min-width:58px;text-align:center;font-weight:700;font-size:var(--fs-12);
    border:1px solid #d1d5db;padding:var(--sp-4) var(--sp-8);border-radius:var(--radius-2);background:#f9fafb;
  }
  .row .txt{font-size:var(--fs-15);font-weight:800;letter-spacing:-0.2px;}
  .row .teacher{font-size:var(--fs-12);color:var(--muted);}
  .row .right{color:var(--muted);font-size:var(--fs-12);}
  .legend{margin-top:var(--sp-10);color:var(--muted);font-size:var(--fs-12);}
  .footer-note{margin-top:var(--sp-10);font-size:var(--fs-12);color:var(--muted);}

  /* focus-visible: 키보드 접근성 */
  :is(button,a,[tabindex],.row):focus-visible{
    outline:2px solid #0a84ff; outline-offset:2px; border-radius:10px;
  }

  /* responsive fine-tune */
  @media (max-width:560px){
    .title{font-size:var(--fs-20);}
    th,td{font-size:var(--fs-15)}
    .chip{min-width:52px}
  }
  .title {
    text-decoration-line: none;
    color : black
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <a class="title" href="./index.html">TMFD 시간표</a>
      <div class="today-info" id="todayInfo">-</div>
    </div>

    <div class="statusbar">
      <span class="badge" id="stateBadge">상태 계산 중…</span>
      <span class="badge dim" id="nextBadge"></span>
    </div>

    <div class="grid">
      <div class="card table-card">
        <div class="table-head">
          <div class="hint">오늘 요일 열(초록) + 현재 교시 행(연한 주황) 하이라이트.</div>
        </div>
        <div class="table-wrap">
          <table id="timetable"></table>
        </div>
        <div class="footer-note">* 교사명은 다수일 경우 · 로 구분됩니다. 요일별 다른 담당은 자동 반영.</div>
      </div>

      <aside class="card side">
        <div>
          <span class="day-badge" id="dayBadge">오늘</span>
          <h3>오늘 시간표</h3>
        </div>
        <div class="list" id="todayList"></div>
        <div class="legend">공강/비어있음은 회색 · 현재 교시는 주황 테두리.</div>
      </aside>
    </div>
  </div>

<script>
/* ===== 1) 과목 기본 담당(문자열/배열 가능) ===== */
const TEACHERS = {
  "종교":"강준원", "유도":"김윤철", "진로":"이진희",
  "공영2":"성우열", "통과2":"신용운",
  "공국2":"사선혜", "공수2":"이종문", "통사2":"김영실",
  "정보":"강철규", "음악":"김성종", "한국2":"장태준",
  "체육":"송원근", "과탐실2":"이진용",
  "공강":null, "비어있음":null
};

/* ===== 2) 요일별 과목 담당(요일→과목→교사[문자/배열]) ===== */
const DAY_SUBJECT_TEACHERS = {
  "월": { "통과2":"신용운" },
  "화": { "통과2":"이희택" },
};

/* ===== 3) 교시별 오버라이드(선택) ===== */
const OVERRIDES = {
  "화":{"5" : ["고윤성"]}
  // "수": { "2": ["보조A","보조B"] },
};

/* ===== 4) 시간표(월~금, 1~7교시) ===== */
const DAYS = ["일","월","화","수","목","금","토"];
const PERIODS = [1,2,3,4,5,6,7];

const TIMETABLE = {
  "월": ["종교","유도","진로","공영2","통과2","공국2","공수2"],
  "화": ["공수2","통사2","음악","한국2","통사2","통과2","공영2"],
  "수": ["공국2","정보","통사2","통과2","공강","한국2","공영2"],
  "목": ["공국2","공영2","한국2","체육","공수2","음악","정보"],
  "금": ["과탐실2","정보","공수2","음악","비어있음","비어있음","비어있음"]
};

/* ===== 5) 종/휴 & 점심시간 ===== */
const BELL = [
  {p:1, start:"08:30", end:"09:20"},
  {p:2, start:"09:30", end:"10:20"},
  {p:3, start:"10:30", end:"11:20"},
  {p:4, start:"11:30", end:"12:20"},
  {p:5, start:"13:40", end:"14:30"},
  {p:6, start:"14:40", end:"15:30"},
  {p:7, start:"15:40", end:"16:30"},
];
const LUNCH = { start:"12:20", end:"13:40" };

/* ===== 6) 유틸 ===== */
function kstNow(){ return new Date(); }
function formatDateKorean(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), da=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${da} (${DAYS[d.getDay()]})`;
}
function isFree(subject){ return !subject || subject==="공강" || subject==="비어있음"; }
function parseHM(hm){ const [h,m]=hm.split(":").map(Number); return h*60+m; }
function minutesNow(d){ return d.getHours()*60 + d.getMinutes(); }

/* ===== 7) 현재 상태 계산 ===== */
function getNowState(dayIdx){
  const now = kstNow(); const nowMin = minutesNow(now);
  if (nowMin >= parseHM(LUNCH.start) && nowMin < parseHM(LUNCH.end)){
    return {state:"lunch", pIndex:-1, label:"점심시간"};
  }
  for (let i=0;i<BELL.length;i++){
    const s=parseHM(BELL[i].start), e=parseHM(BELL[i].end);
    if(nowMin>=s && nowMin<e) return {state:"class", pIndex:i, label:`${BELL[i].p}교시 수업 중`};
  }
  return {state:"break", pIndex:-1, label:"쉬는 시간"};
}

/* ===== 8) 교사명 해석(오버라이드 → 요일별 → 기본) ===== */
function getTeachers(subject, dayKey, periodNum){
  const ov = OVERRIDES?.[dayKey]?.[String(periodNum)];
  if (ov && ov.length) return Array.isArray(ov) ? ov.join(" · ") : ov;

  const dayMap = DAY_SUBJECT_TEACHERS?.[dayKey]?.[subject];
  if (dayMap) return Array.isArray(dayMap) ? dayMap.join(" · ") : dayMap;

  const base = TEACHERS[subject];
  if (!base) return "";
  return Array.isArray(base) ? base.join(" · ") : base;
}

/* ===== 9) 테이블 렌더링 ===== */
function renderTable(todayColIdx, nowRowIdx){
  const table = document.getElementById("timetable");
  table.innerHTML = "";

  // 헤더
  const trHead = document.createElement("tr");
  const th0 = document.createElement("th"); th0.className="period"; th0.textContent="교시";
  trHead.appendChild(th0);
  const weekdays=["월","화","수","목","금"];
  weekdays.forEach((d,i)=>{
    const th=document.createElement("th"); th.textContent=d;
    if(i+1===todayColIdx) th.classList.add("today-col");
    trHead.appendChild(th);
  });
  table.appendChild(trHead);

  // 본문
  PERIODS.forEach((p, rowIdx)=>{
    const tr=document.createElement("tr");
    if (nowRowIdx===rowIdx) tr.classList.add("now-row");

    const tdPeriod=document.createElement("td");
    tdPeriod.className="period";
    tdPeriod.textContent=`${p}교시`;
    tr.appendChild(tdPeriod);

    ["월","화","수","목","금"].forEach((dayLabel, i)=>{
      const subj = TIMETABLE[dayLabel]?.[p-1] || "";
      const teacherTxt = getTeachers(subj, dayLabel, p);

      const td=document.createElement("td");
      td.className="subject-cell";
      if(i+1===todayColIdx) td.classList.add("today-col");

      if(isFree(subj)){
        td.innerHTML=`<span class="free">${subj || "-"}</span>`;
      }else{
        td.innerHTML=`
          <span class="subject-pill">${subj}</span>
          <small>${teacherTxt}</small>
        `;
      }
      tr.appendChild(td);
    });

    table.appendChild(tr);
  });
}

/* ===== 10) 오늘 리스트 렌더링 ===== */
function renderTodayList(dayIdx, nowRowIdx){
  const list = document.getElementById("todayList");
  const badge = document.getElementById("dayBadge");
  list.innerHTML = "";

  if(dayIdx===0 || dayIdx===6){
    badge.textContent="주말";
    const msg=document.createElement("div");
    msg.className="row";
    msg.innerHTML = `<div class="left"><span class="chip">-</span><div>
      <div class="txt">수업 없음</div>
      <div class="teacher">두뇌 캐시 비우는 날</div>
    </div></div>`;
    list.appendChild(msg);
    return;
  }

  const weekdays = ["일","월","화","수","목","금","토"];
  badge.textContent=`${weekdays[dayIdx]}요일`;

  const dayKey = ["월","화","수","목","금"][dayIdx-1];
  const arr = TIMETABLE[dayKey] || [];

  PERIODS.forEach((p, idx)=>{
    const subj = arr[p-1] || "";
    const teachers = getTeachers(subj, dayKey, p);

    const row=document.createElement("div");
    row.className="row";
    if (nowRowIdx===idx) row.classList.add("now");

    row.innerHTML = `
      <div class="left">
        <span class="chip">${p}교시</span>
        <div>
          <div class="txt">${subj || "-"}</div>
          <div class="teacher">${isFree(subj) ? "공강/자습" : teachers}</div>
        </div>
      </div>
      <div class="right">${isFree(subj) ? "휴식" : "수업"}</div>
    `;
    list.appendChild(row);
  });
}

/* ===== 11) 상태 배지 렌더링 ===== */
function renderStatus(dayIdx, nowState){
  const stateEl = document.getElementById("stateBadge");
  const nextEl  = document.getElementById("nextBadge");

  if(dayIdx===0 || dayIdx===6){
    stateEl.textContent = "주말";
    nextEl.textContent = "";
    return;
  }
  const dayKey = ["월","화","수","목","금"][dayIdx-1];

  if(nowState.state==="lunch"){
    stateEl.textContent = `지금: 점심시간 (${LUNCH.start}~${LUNCH.end})`;
    nextEl.textContent  = nextClassInfo(dayKey);
    return;
  }
  if(nowState.state==="break"){
    stateEl.textContent = "지금: 쉬는 시간";
    nextEl.textContent  = nextClassInfo(dayKey);
    return;
  }
  if(nowState.state==="class"){
    const bell = BELL[nowState.pIndex];
    const periodNum = bell.p;
    const subj = TIMETABLE[dayKey]?.[periodNum-1] || "";
    const teachers = getTeachers(subj, dayKey, periodNum);
    stateEl.textContent = `지금: ${periodNum}교시 ${subj} (${bell.start}~${bell.end})`;
    if(!isFree(subj) && teachers) stateEl.textContent += ` · ${teachers}`;
    nextEl.textContent = nextClassInfo(dayKey, nowState.pIndex+1);
  }
}

function nextClassInfo(dayKey, fromIndex=0){
  for(let i=fromIndex;i<BELL.length;i++){
    const subj = TIMETABLE[dayKey]?.[BELL[i].p-1] || "";
    if(!isFree(subj)){
      const t = getTeachers(subj, dayKey, BELL[i].p);
      return `다음: ${BELL[i].p}교시 ${subj} ${t?`· ${t}`:""} (${BELL[i].start}~${BELL[i].end})`;
    }
  }
  return "다음: 오늘 수업 종료";
}

/* ===== 12) 초기화 & 1분 자동 갱신 ===== */
(function init(){
  const now = kstNow();
  document.getElementById("todayInfo").textContent = formatDateKorean(now);

  const dayIdx = now.getDay(); // 0=일 ... 6=토
  const todayColIdx = (dayIdx>=1 && dayIdx<=5) ? dayIdx : -1;

  const state = getNowState(dayIdx);
  const nowRowIdx = (dayIdx>=1 && dayIdx<=5 && state.state==="class") ? state.pIndex : -1;

  renderTable(todayColIdx, nowRowIdx);
  renderTodayList(dayIdx, nowRowIdx);
  renderStatus(dayIdx, state);

  setInterval(()=>{
    const d = kstNow();
    const dayIdx2 = d.getDay();
    const state2 = getNowState(dayIdx2);
    const nowRowIdx2 = (dayIdx2>=1 && dayIdx2<=5 && state2.state==="class") ? state2.pIndex : -1;
    renderTable((dayIdx2>=1 && dayIdx2<=5)?dayIdx2:-1, nowRowIdx2);
    renderTodayList(dayIdx2, nowRowIdx2);
    renderStatus(dayIdx2, state2);
    document.getElementById("todayInfo").textContent = formatDateKorean(d);
  }, 60*1000);
})();
</script>
</body>
</html>
