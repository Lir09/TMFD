<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>학습자료실</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter','Noto Sans KR',system-ui,-apple-system,Segoe UI,Roboto,'Apple SD Gothic Neo',sans-serif;
            background: #fff;
            margin: 0;
            color: #151515;
        }
        .container {
            max-width: 1000px;
            margin: 48px auto 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px #0001;
            padding: 40px 32px 32px 32px;
        }
        h1 {
            color: #151515;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 36px;
            letter-spacing: -1px;
        }
        .subject-list {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 32px;
        }
        .subject {
            background: #fafbfc;
            border-radius: 12px;
            box-shadow: 0 2px 8px #0001;
            padding: 28px 24px 24px 24px;
            display: flex;
            flex-direction: row;
            align-items: center;
            border-left: 6px solid #e5e7eb; /* 기본 연회색 */
            transition: border-color 0.2s;
        }
        .subject .emoji {
            font-size: 2.1rem;
            margin-right: 18px;
            flex-shrink: 0;
        }
        .subject h2 {
            margin: 0 0 12px 0;
            color: #151515;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .btn1 {
            background: #151515;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 9px 18px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 2px 6px #0002;
            transition: background 0.2s;
        }
        .btn1:hover {
            background: #222;
        }
        /* 과목별 테두리 색상 */
        .subject.kor { border-left-color: #e57373; }    /* 국어 - 연빨강 */
        .subject.math { border-left-color: #64b5f6; }   /* 수학 - 연파랑 */
        .subject.soc { border-left-color: #ffd54f; }    /* 사회 - 연노랑 */
        .subject.sci { border-left-color: #81c784; }    /* 과학 - 연초록 */
        .subject.eng { border-left-color: #ba68c8; }    /* 영어 - 연보라 */
        .subject.hist { border-left-color: #ffb74d; }   /* 한국사 - 연주황 */
        @media (max-width: 900px) {
            .subject-list { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 600px) {
            .container { padding: 16px 4vw; }
            .subject-list { grid-template-columns: 1fr; gap: 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>학습자료실</h1>
        <div class="subject-list">
            <div class="subject kor">
                <span class="emoji">📖</span>
                <div>
                    <h2>국어</h2>
                    <button onclick="window.open('https://drive.google.com/drive/folders/1-ff6qkpYigtwhuaUJqpBq13AY-21ExvJ?usp=sharing', '_blank')" class="btn1">바로가기</button>
                </div>
            </div>
            <div class="subject math">
                <span class="emoji">🧮</span>
                <div>
                    <h2>수학</h2>
                    <button onclick="window.open('https://drive.google.com/drive/folders/185CVzX_neXVfpc2Ocpt1e2TtztCqaWXc?usp=sharing', '_blank')" class="btn1">바로가기</button>
                </div>
            </div>
            <div class="subject soc">
                <span class="emoji">🌏</span>
                <div>
                    <h2>사회</h2>
                    <button onclick="window.open('https://drive.google.com/drive/folders/1vlTz2PaFm8V5xvnvEywHED6izm7HeZUW?usp=sharing', '_blank')" class="btn1">바로가기</button>
                </div>
            </div>
            <div class="subject sci">
                <span class="emoji">🔬</span>
                <div>
                    <h2>과학</h2>
                    <button onclick="window.open('https://drive.google.com/drive/folders/1SFE8UhNvzEhp1Ce_cwlCbZwuy8b9-z19?usp=sharing', '_blank')" class="btn1">바로가기</button>
                </div>
            </div>
            <div class="subject eng">
                <span class="emoji">📝</span>
                <div>
                    <h2>영어</h2>
                    <button onclick="window.open('https://drive.google.com/drive/folders/147KGQWS7pbG0S6oFNd9JfIPQK3JBNN4M?usp=sharing', '_blank')" class="btn1">바로가기</button>
                </div>
            </div>
            <div class="subject hist">
                <span class="emoji">🏛️</span>
                <div>
                    <h2>한국사</h2>
                    <button onclick="window.open('https://drive.google.com/drive/folders/1rpYyQYT682nhiY3J6fBiChkj_j3oERnX?usp=sharing', '_blank')" class="btn1">바로가기</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
